services:
  - type: web
    name: smart-health-monitoring
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn health_system.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smart-health-db
          property: connectionString

databases:
  - name: smart-health-db
    plan: free
