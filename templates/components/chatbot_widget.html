<!-- AI Assistant Chat Widget (site-wide) -->
<div id="shmasChatbot">
  <button id="shmasChatToggle" type="button" aria-label="Open AI Assistant">
    <i class="bi bi-chat-dots-fill"></i>
  </button>

  <div id="shmasChatWindow" class="d-none">
    <div class="shmas-chat-header">
      <div>
        <strong>SmartHealth Assistant</strong>
        <div class="shmas-chat-sub">Health questions &amp; site help</div>
      </div>
      <button type="button" id="shmasChatClose" aria-label="Close">&times;</button>
    </div>
    <div id="shmasChatMessages" class="shmas-chat-messages">
      <div class="shmas-msg shmas-msg-bot">Hi! I'm your SmartHealth Assistant. Ask me a general health question, or ask how to do something on this site (e.g. "how do I book an appointment?").</div>
    </div>
    <div class="shmas-chat-input-row">
      <button type="button" id="shmasChatMic" title="Tap to speak, tap again when done" aria-label="Voice input"><i class="bi bi-mic-fill"></i></button>
      <input type="text" id="shmasChatInput" placeholder="Type a message..." autocomplete="off">
      <button type="button" id="shmasChatSend" title="Send" aria-label="Send"><i class="bi bi-send-fill"></i></button>
    </div>
  </div>
</div>

<style>
#shmasChatbot { position: fixed; bottom: 22px; right: 22px; z-index: 1055; font-family: 'Inter', sans-serif; }
#shmasChatToggle {
  width: 58px; height: 58px; border-radius: 50%; border: none;
  background: var(--primary-teal, #0F766E); color: #fff; font-size: 1.4rem;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25); cursor: pointer;
}
#shmasChatToggle:hover { filter: brightness(1.08); }
#shmasChatWindow {
  position: absolute; bottom: 72px; right: 0; width: 340px; max-width: 90vw;
  height: 460px; max-height: 70vh; background: #fff; border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column;
  overflow: hidden; border: 1px solid #E2E8F0;
}
.shmas-chat-header {
  background: var(--primary-teal, #0F766E); color: #fff; padding: 12px 14px;
  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
}
.shmas-chat-sub { font-size: 0.7rem; opacity: 0.85; }
#shmasChatClose { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; line-height: 1; padding: 0; }
.shmas-chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: #F8FAFC; }
.shmas-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.85rem; line-height: 1.35; white-space: pre-wrap; }
.shmas-msg-bot { background: #E2E8F0; color: #0F172A; border-bottom-left-radius: 2px; }
.shmas-msg-user { background: var(--primary-teal, #0F766E); color: #fff; margin-left: auto; border-bottom-right-radius: 2px; }
.shmas-msg-typing { font-style: italic; color: #64748B; background: transparent; }
.shmas-chat-input-row { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #E2E8F0; background: #fff; flex-shrink: 0; }
.shmas-chat-input-row input {
  flex: 1; border: 1px solid #E2E8F0; border-radius: 20px; padding: 8px 14px; font-size: 0.85rem; outline: none; min-width: 0;
}
.shmas-chat-input-row button {
  border: none; background: var(--primary-teal, #0F766E); color: #fff; width: 36px; height: 36px;
  border-radius: 50%; flex-shrink: 0; cursor: pointer;
}
#shmasChatMic.listening { background: #DC2626; }
@media (max-width: 480px) {
  #shmasChatWindow { width: 92vw; right: -6px; }
}
</style>
